<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal del Estudiante | Veraxis</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/config.js"></script>
  <script>
    if (!localStorage.getItem('sesionActiva')) {
      window.location.href = 'login.html';
    }
  </script>
  <style>
    body { background-color: #f8f9fa; }
    .avatar { width: 100px; height: 100px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>

<header class="bg-dark text-white py-3 px-4">
  <div class="container d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center">
      <img src="assets/logo.png" alt="Logo" width="50" class="me-3" data-branding="logo" style="filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));" />
      <div>
        <h1 class="h5 mb-0" data-branding="nombre">Veraxis</h1>
        <small>Portal del Estudiante</small>
      </div>
    </div>
    <div>
      <button onclick="abrirCambiarClave()" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-key me-1"></i>Cambiar contraseña</button>
      <button onclick="logout()" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
    </div>
  </div>
</header>

<div class="modal fade" id="modalCambiarClave" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Cambiar contraseña</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <form id="formCambiarClave">
          <div class="mb-3">
            <label class="form-label">Contraseña nueva (mínimo 8 caracteres)</label>
            <input type="password" class="form-control" id="claveNueva" required minlength="8" />
          </div>
          <button type="submit" class="btn btn-primary w-100">Guardar</button>
        </form>
      </div>
    </div>
  </div>
</div>

<main class="container my-4" id="portalContenido" style="display:none">

  <div class="card p-3 mb-4">
    <div class="d-flex align-items-center">
      <img id="fotoEstudiante" src="assets/avatar-placeholder.png" class="avatar me-3" alt="Foto" />
      <div class="flex-grow-1">
        <h3 id="nombreEstudiante">Cargando...</h3>
        <div id="metaEstudiante" class="text-muted small"></div>
        <span id="badgeEstado" class="badge bg-secondary"></span>
      </div>
      <div style="width:260px">
        <div class="mb-2 small text-muted">Progreso de horas</div>
        <div class="progress mb-2" style="height:18px">
          <div id="barraProgreso" class="progress-bar" role="progressbar" style="width:0%"></div>
        </div>
        <div class="d-flex justify-content-between small">
          <div id="horasInfo">0 / 0 hrs</div>
          <div id="saldoPendiente" class="text-danger">RD$ 0</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <ul class="nav nav-tabs" id="portalTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-general">Información General</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-pagos">Pagos</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-asistencias">Asistencias</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-horario">Horario</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-evaluaciones">Evaluaciones</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-examenes">Exámenes</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-certificados">Certificados</button></li>
      </ul>
      <div class="tab-content mt-3">
        <div class="tab-pane fade show active" id="tab-general"><div id="generalContent"></div></div>
        <div class="tab-pane fade" id="tab-pagos"><div id="pagosContent"></div></div>
        <div class="tab-pane fade" id="tab-asistencias"><div id="asistenciasContent"></div></div>
        <div class="tab-pane fade" id="tab-horario"><div id="horarioContent"></div></div>
        <div class="tab-pane fade" id="tab-evaluaciones"><div id="evaluacionesContent"></div></div>
        <div class="tab-pane fade" id="tab-examenes"><div id="examenesContent"></div></div>
        <div class="tab-pane fade" id="tab-certificados"><div id="certificadosContent"></div></div>
      </div>
    </div>
  </div>
</main>

<div class="container my-5" id="sinAcceso" style="display:none">
  <div class="alert alert-warning">
    Tu cuenta todavía no está vinculada a ningún expediente. Contacta a la administración de la escuela.
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/authHelpers.js"></script>
<script src="js/portal-estudiante.js"></script>
</body>
</html>
