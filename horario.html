<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Horario | Veraxis</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <script src="js/config.js"></script>
<script src="js/authHelpers.js"></script>
<script>aplicarBranding();</script>
  <script>
    if (!localStorage.getItem('sesionActiva')) {
      window.location.href = 'login.html';
    }
  </script>
  
  <style>
    body {
      background-color: #f8f9fa;
    }
    .horario-item {
      animation: fadeInSlide 0.5s ease;
    }
    @keyframes fadeInSlide {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .horario-item:hover {
      background-color: #e8f7ff;
      cursor: pointer;
    }
    .alert-success {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1050;
      display: none;
      width: auto;
      min-width: 260px;
    }
  </style>
</head>
<body>
  <div id="mensajeExito" class="alert alert-success text-center"></div>

  <header class="bg-dark text-white py-3 px-4 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
      <img src="assets/logo.png" alt="Logo" width="50" class="rounded-circle" data-branding="logo" style="filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));" />
      <div>
        <h1 class="h5 mb-0" data-branding="nombre">Veraxis</h1>
        <small>Mi Horario</small>
      </div>
    </div>
    <div class="d-flex gap-2">
      <button onclick="printHorario()" class="btn btn-outline-light btn-sm">Imprimir horario</button>
      <a href="panel.html" class="btn btn-outline-light btn-sm">Volver al Panel</a>
    </div>
  </header>

  <main class="container my-5">
    <div class="row g-4 mb-4">
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">Agendar Clase</div>
          <div class="card-body">
            <form id="formHorario" class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Cliente</label>
                <select class="form-select" id="cliente" required>
                  <option value="">Seleccione un cliente</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Día</label>
                <select class="form-select" id="dia" required>
                  <option value="">Seleccione un día</option>
                  <option>Lunes</option>
                  <option>Martes</option>
                  <option>Miércoles</option>
                  <option>Jueves</option>
                  <option>Viernes</option>
                  <option>Sábado</option>
                  <option>Domingo</option>
                </select>
              </div>
              <div class="col-md-2">
                <label class="form-label">Hora</label>
                <input type="time" class="form-control" id="hora" required />
              </div>
              <div class="col-md-1">
                <label class="form-label"># Clase</label>
                <input type="number" class="form-control" id="numeroClase" readonly />
              </div>
              <div class="col-md-2">
                <label class="form-label">¿Repetir?</label>
                <select class="form-select" id="repetir" required>
                  <option value="true">Sí</option>
                  <option value="false">No</option>
                </select>
              </div>
              <div class="col-12 text-end">
                <button type="submit" class="btn btn-success">Agregar Clase</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-12">
        <div class="card shadow-sm">
          <div class="card-header bg-secondary text-white">Horario Actual</div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-bordered table-striped mb-0">
                <thead class="table-dark">
                  <tr>
                    <th>Cliente</th>
                    <th>Día</th>
                    <th>Hora</th>
                    <th># Clase</th>
                    <th>Repetir</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody id="tablaHorarios"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    async function cargarClientes() {
      const select = document.getElementById("cliente");
      if (!select) return;
      select.innerHTML = '<option value="">Seleccione un cliente</option>';
      try {
        const res = await fetch(API_BASE + "/api/clientes", { headers: getAuthHeaders() });
        const clientes = await res.json();
        clientes.forEach(c => {
          const option = document.createElement("option");
          option.value = c.id;
          option.textContent = c.nombre;
          select.appendChild(option);
        });
      } catch (error) {
        console.error("Error cargando clientes", error);
      }
    }

    async function guardarHorario(e) {
      e.preventDefault();
      const clienteEl = document.getElementById("cliente");
      if (!clienteEl?.value) {
        alert("Seleccione cliente");
        return;
      }

      const data = {
        cliente_id: parseInt(clienteEl.value),
        dia: document.getElementById("dia")?.value,
        hora: document.getElementById("hora")?.value,
        numero_clase: parseInt(document.getElementById("numeroClase")?.value) || 1,
        repetir: document.getElementById("repetir")?.value === "true"
      };

      try {
        const res = await fetch(API_BASE + "/api/horarios", {
          method: "POST",
          headers: { ...getAuthHeaders(), "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          mostrarMensajeExito("Clase agregada");
          e.target.reset();
          const numero = document.getElementById("numeroClase");
          if (numero) numero.value = "";
          cargarHorarios();
        } else {
          const body = await res.json().catch(() => null);
          alert("Error guardando: " + (body?.error || res.status));
        }
      } catch (error) {
        console.error(error);
        alert("Error de conexión con el servidor");
      }
    }

    async function cargarHorarios() {
      const tbody = document.getElementById("tablaHorarios");
      if (!tbody) return;
      tbody.innerHTML = "";
      try {
        const res = await fetch(API_BASE + "/api/horarios", { headers: getAuthHeaders() });
        const horarios = await res.json();
        horarios.forEach(h => {
          const fila = document.createElement("tr");
          fila.className = "horario-item";
          fila.innerHTML = `
            <td>${escapeHtml(h.nombre_cliente) || "Sin cliente"}</td>
            <td>${escapeHtml(h.dia)}</td>
            <td>${escapeHtml(h.hora)}</td>
            <td>${h.numero_clase || 1}</td>
            <td>${h.repetir ? "Sí" : "No"}</td>
            <td>
              <button class="btn btn-success btn-sm me-2" onclick="marcarClaseHecha(${h.id})">Hecho</button>
              <button class="btn btn-danger btn-sm" onclick="eliminarHorario(${h.id})">Eliminar</button>
            </td>
          `;
          tbody.appendChild(fila);
        });
      } catch (error) {
        console.error("Error cargando horarios", error);
      }
    }

    async function eliminarHorario(id) {
      if (!confirm("¿Eliminar esta clase?")) return;
      try {
        const res = await fetch(`${API_BASE}/api/horarios/${id}`, { method: "DELETE", headers: getAuthHeaders() });
        if (res.ok) cargarHorarios();
        else alert("No se pudo eliminar la clase.");
      } catch (error) {
        console.error(error);
        alert("Error eliminando horario");
      }
    }

    async function marcarClaseHecha(id) {
      try {
        const res = await fetch(`${API_BASE}/api/horarios/hecho/${id}`, { method: "PATCH", headers: getAuthHeaders() });
        if (res.ok) {
          mostrarMensajeExito("Clase completada");
          cargarHorarios();
        } else {
          alert("No se pudo marcar la clase como hecha.");
        }
      } catch (error) {
        console.error(error);
        alert("Error actualizando horario");
      }
    }

    function printHorario() {
      const tabla = document.getElementById("tablaHorarios");
      if (!tabla) return;

      const contenido =
        '<!doctype html>' +
        '<html>' +
        '<head>' +
        '<title>Horario</title>' +
        '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />' +
        '<style>body { padding: 20px; font-family: Arial, sans-serif; } .no-print { display: none !important; } table { width: 100%; border-collapse: collapse; }</style>' +
        '</head>' +
        '<body>' +
        '<div class="container mt-4">' +
        '<h2>Mi Horario</h2>' +
        tabla.outerHTML +
        '<' + '/body></html>';

      const iframe = document.createElement('iframe');
      iframe.style.position = 'fixed';
      iframe.style.right = '0';
      iframe.style.bottom = '0';
      iframe.style.width = '0';
      iframe.style.height = '0';
      iframe.style.border = '0';
      iframe.style.visibility = 'hidden';
      document.body.appendChild(iframe);
      iframe.srcdoc = contenido;
      iframe.onload = function () {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(() => document.body.removeChild(iframe), 1000);
      };
    }

    function mostrarMensajeExito(texto) {
      const mensaje = document.getElementById("mensajeExito");
      if (!mensaje) { alert(texto); return; }
      mensaje.textContent = texto;
      mensaje.style.display = "block";
      setTimeout(() => { mensaje.style.display = "none"; }, 3000);
    }

    document.addEventListener("DOMContentLoaded", () => {
      cargarClientes();
      cargarHorarios();
      const form = document.getElementById("formHorario");
      if (form) form.addEventListener("submit", guardarHorario);
      const clienteSelect = document.getElementById("cliente");
      if (clienteSelect) {
        clienteSelect.addEventListener("change", async function () {
          const id = this.value;
          if (!id) {
            document.getElementById("numeroClase").value = "";
            return;
          }
          try {
            const res = await fetch(`${API_BASE}/api/asistencias/cliente/${id}`, { headers: getAuthHeaders() });
            const asistencias = await res.json();
            document.getElementById("numeroClase").value = asistencias.length + 1;
          } catch (error) {
            document.getElementById("numeroClase").value = 1;
          }
        });
      }
    });
  </script>
</body>
</html>
