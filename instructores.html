<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instructores | Montas Auto Academy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body>
<script>
  if (!localStorage.getItem('sesionActiva')) {
    window.location.href = 'login.html';
  }
</script>

<nav class="navbar navbar-dark bg-dark px-4 py-3">
  <div class="d-flex align-items-center">
    <img data-branding="logo" src="assets/logo.png" alt="Logo Montas Auto Academy" width="50" class="me-2" />
    <div class="text-white">
      <h1 class="h5 mb-0">Instructores</h1>
      <small>Administra instructores y asignaciones</small>
    </div>
  </div>
  <div class="ms-auto">
    <a href="panel.html" class="btn btn-outline-light btn-sm me-2">Inicio</a>
    <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
  </div>
</nav>

<main class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h5 mb-0">Lista de instructores</h2>
    <button class="btn btn-primary" onclick="abrirFormularioInstructor()">+ Nuevo instructor</button>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle text-center">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Teléfono</th>
          <th>Correo</th>
          <th>Especialidad</th>
          <th>Estado</th>
          <th>Cuenta vinculada</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaInstructores">
        <tr><td colspan="7">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="modalInstructor" tabindex="-1" aria-labelledby="modalInstructorLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <form class="modal-content" id="formInstructor">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title" id="modalInstructorLabel">Nuevo instructor</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input id="instrNombre" class="form-control" required />
          </div>
          <div class="col-md-6">
            <label class="form-label">Teléfono</label>
            <input id="instrTelefono" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Correo electrónico</label>
            <input id="instrCorreo" type="email" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Especialidad</label>
            <input id="instrEspecialidad" class="form-control" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Activo</label>
            <select id="instrActivo" class="form-select">
              <option value="true">Sí</option>
              <option value="false">No</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Cuenta de usuario vinculada</label>
            <select id="instrUsuarioId" class="form-select">
              <option value="">Sin vincular</option>
            </select>
            <div class="form-text">Conecta este instructor con su cuenta de acceso para que su panel muestre solo sus estudiantes y horario.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Sucursal</label>
            <select id="instrSucursalId" class="form-select">
              <option value="">Sin asignar</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Guardar instructor</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/authHelpers.js"></script>
<script>aplicarBranding();</script>
<script>
  let instructorEditId = null;
  let usuariosDisponibles = [];
  const modalInstructor = new bootstrap.Modal(document.getElementById('modalInstructor'));

  async function cargarUsuariosDisponibles() {
    try {
      const res = await fetch(API_BASE + '/api/configuracion/usuarios', {
        headers: getAuthHeaders()
      });
      if (!res.ok) return;
      usuariosDisponibles = await res.json();
      const select = document.getElementById('instrUsuarioId');
      select.innerHTML = '<option value="">Sin vincular</option>';
      usuariosDisponibles.forEach(u => {
        const option = document.createElement('option');
        option.value = u.id;
        option.textContent = `${u.usuario} (${u.rol})`;
        select.appendChild(option);
      });
    } catch (error) {
      console.error('Error cargando usuarios:', error);
    }
  }

  async function cargarSucursalesDisponibles() {
    try {
      const res = await fetch(API_BASE + '/api/sucursales', { headers: getAuthHeaders() });
      if (!res.ok) return;
      const sedes = await res.json();
      const select = document.getElementById('instrSucursalId');
      select.innerHTML = '<option value="">Sin asignar</option>';
      sedes.forEach(s => {
        const option = document.createElement('option');
        option.value = s.id;
        option.textContent = s.nombre;
        select.appendChild(option);
      });
    } catch (error) {
      console.error('Error cargando sucursales:', error);
    }
  }

  async function cargarInstructores() {
    const tabla = document.getElementById('tablaInstructores');
    tabla.innerHTML = '<tr><td colspan="7">Cargando...</td></tr>';

    try {
      const res = await fetch(API_BASE + '/api/instructores', {
        headers: getAuthHeaders()
      });

      if (!res.ok) {
        const errorText = await res.text();
        console.error('Error cargando instructores', res.status, errorText);
        tabla.innerHTML = '<tr><td colspan="7">Error al cargar instructores.</td></tr>';
        return;
      }

      const instructores = await res.json();

      if (!Array.isArray(instructores) || instructores.length === 0) {
        tabla.innerHTML = '<tr><td colspan="7">No hay instructores registrados.</td></tr>';
        return;
      }

      tabla.innerHTML = '';
      instructores.forEach(ins => {
        tabla.innerHTML += `
          <tr>
            <td>${escapeHtml(ins.nombre)}</td>
            <td>${escapeHtml(ins.telefono) || '-'}</td>
            <td>${escapeHtml(ins.correo) || '-'}</td>
            <td>${escapeHtml(ins.especialidad) || '-'}</td>
            <td>${ins.activo ? 'Activo' : 'Inactivo'}</td>
            <td>${ins.usuario_vinculado ? `<span class="badge bg-info text-dark">${escapeHtml(ins.usuario_vinculado)}</span>` : '<span class="text-muted">Sin vincular</span>'}</td>
            <td>
              <button class="btn btn-sm btn-warning me-1" onclick="editarInstructor(${ins.id})">Editar</button>
              <button class="btn btn-sm btn-danger" onclick="eliminarInstructor(${ins.id})">Eliminar</button>
            </td>
          </tr>`;
      });
    } catch (error) {
      console.error(error);
      tabla.innerHTML = '<tr><td colspan="7">Error al cargar instructores.</td></tr>';
    }
  }

  function abrirFormularioInstructor() {
    instructorEditId = null;
    document.getElementById('modalInstructorLabel').textContent = 'Nuevo instructor';
    document.getElementById('formInstructor').reset();
    document.getElementById('instrActivo').value = 'true';
    cargarUsuariosDisponibles();
    cargarSucursalesDisponibles();
    modalInstructor.show();
  }

  async function editarInstructor(id) {
    try {
      const res = await fetch(`${API_BASE}/api/instructores/${id}`, {
        headers: getAuthHeaders()
      });

      if (!res.ok) {
        const errorText = await res.text();
        console.error('Error cargando instructor', res.status, errorText);
        alert('No se pudo cargar el instructor para editar.');
        return;
      }

      const ins = await res.json();
      instructorEditId = id;
      document.getElementById('modalInstructorLabel').textContent = 'Editar instructor';
      document.getElementById('instrNombre').value = ins.nombre || '';
      document.getElementById('instrTelefono').value = ins.telefono || '';
      document.getElementById('instrCorreo').value = ins.correo || '';
      document.getElementById('instrEspecialidad').value = ins.especialidad || '';
      document.getElementById('instrActivo').value = ins.activo ? 'true' : 'false';
      await Promise.all([cargarUsuariosDisponibles(), cargarSucursalesDisponibles()]);
      document.getElementById('instrUsuarioId').value = ins.usuario_id || '';
      document.getElementById('instrSucursalId').value = ins.sucursal_id || '';
      modalInstructor.show();
    } catch (error) {
      console.error(error);
      alert('No se pudo cargar el instructor para editar.');
    }
  }

  async function eliminarInstructor(id) {
    if (!confirm('¿Deseas eliminar este instructor?')) return;
    try {
      await fetch(`${API_BASE}/api/instructores/${id}`, {
        method: 'DELETE',
        headers: getAuthHeaders()
      });
      cargarInstructores();
    } catch (error) {
      console.error(error);
      alert('No se pudo eliminar el instructor.');
    }
  }

  document.getElementById('formInstructor').addEventListener('submit', async function (e) {
    e.preventDefault();

    const payload = {
      nombre: document.getElementById('instrNombre').value.trim(),
      telefono: document.getElementById('instrTelefono').value.trim(),
      correo: document.getElementById('instrCorreo').value.trim(),
      especialidad: document.getElementById('instrEspecialidad').value.trim(),
      activo: document.getElementById('instrActivo').value === 'true',
      usuario_id: document.getElementById('instrUsuarioId').value || null,
      sucursal_id: document.getElementById('instrSucursalId').value || null
    };

    try {
      const url = instructorEditId ? `${API_BASE}/api/instructores/${instructorEditId}` : API_BASE + '/api/instructores';
      const method = instructorEditId ? 'PUT' : 'POST';
      const res = await fetch(url, {
        method,
        headers: getAuthHeaders(),
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const errorText = await res.text();
        console.error('Error guardando instructor', res.status, errorText);
        throw new Error('Error guardando instructor');
      }
      modalInstructor.hide();
      cargarInstructores();
    } catch (error) {
      console.error(error);
      alert('No se pudo guardar el instructor.');
    }
  });

  function cerrarSesion() {
    logout();
  }

  window.onload = function() {
    if (requireAdminPage()) {
      cargarInstructores();
    }
  };
</script>
</body>
</html>
