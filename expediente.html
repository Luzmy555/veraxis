<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Expediente del Cliente</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .avatar { width:120px; height:120px; object-fit:cover; border-radius:8px; }
    .doc-thumb { width:48px; height:48px; object-fit:cover; border-radius:6px; }
    .upload-progress { height:6px; }
    #infoGeneral .card { border: 1px solid #ddd; }
    #infoGeneral .card-header { border-bottom: 2px solid rgba(0,0,0,.125); }
    #infoGeneral p { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-4 py-3">
    <div class="d-flex align-items-center">
      <img src="assets/logo.png" alt="Logo" width="40" class="me-2" />
      <div class="text-white">
        <h1 class="h6 mb-0">Expediente del Cliente</h1>
      </div>
    </div>
    <div class="ms-auto">
      <a href="cliente.html" class="btn btn-outline-light btn-sm">Volver</a>
    </div>
  </nav>

  <main class="container my-4">
    <div id="headerExpediente" class="card p-3 mb-4">
      <div class="d-flex align-items-center">
        <img id="fotoCliente" src="assets/avatar-placeholder.png" class="avatar me-3" alt="Foto cliente" />
        <div class="flex-grow-1">
          <h3 id="nombreCliente">Cargando...</h3>
          <div id="metaCliente" class="text-muted small"></div>
          <div class="mt-2">
            <span id="badgeEstado" class="badge bg-secondary">Estado</span>
            <span id="fechaInscripcion" class="ms-2 small text-muted"></span>
          </div>
        </div>
        <div style="width:260px">
          <div class="mb-2 small text-muted">Progreso de horas</div>
          <div class="progress mb-2" style="height:18px">
            <div id="barraProgreso" class="progress-bar" role="progressbar" style="width:0%"></div>
          </div>
          <div class="d-flex justify-content-between small">
            <div id="horasInfo">0 / 0 hrs</div>
            <div id="saldoPendiente" class="text-danger">$0.00</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <ul class="nav nav-tabs" id="expedienteTabs" role="tablist">
          <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-general">Información General</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-pagos">Pagos</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-asistencias">Asistencias</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-documentos">Documentos</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-observaciones">Observaciones</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-evaluaciones">Evaluaciones</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-examenes">Exámenes</button></li>
          <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-certificados">Certificados</button></li>
        </ul>
        <div class="tab-content mt-3">
          <div class="tab-pane fade show active" id="tab-general">
            <div id="infoGeneral"></div>
          </div>
          <div class="tab-pane fade" id="tab-pagos">
            <div id="pagosContent"></div>
          </div>
          <div class="tab-pane fade" id="tab-asistencias">
            <div id="asistenciasContent"></div>
          </div>
          <div class="tab-pane fade" id="tab-documentos">
            <div id="documentosUploadArea" class="mb-3"></div>
            <div id="documentosContent"></div>
          </div>
          <div class="tab-pane fade" id="tab-observaciones">
            <div id="observacionesContent"></div>
          </div>
          <div class="tab-pane fade" id="tab-evaluaciones">
            <div id="evaluacionesContent"><p class="text-muted">Próximamente: Evaluaciones.</p></div>
          </div>
          <div class="tab-pane fade" id="tab-examenes">
            <div id="examenesContent"><p class="text-muted">Próximamente: Exámenes.</p></div>
          </div>
          <div class="tab-pane fade" id="tab-certificados">
            <div id="certificadosContent"><p class="text-muted">Próximamente: Certificados.</p></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal: Preview -->
  <div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 id="previewTitle" class="modal-title">Vista previa</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center p-3" id="previewBody"></div>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1055">
    <div id="toasts"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/authHelpers.js"></script>
  <script src="js/expediente.js"></script>
</body>
</html>
