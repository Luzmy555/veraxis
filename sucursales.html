<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sucursales | Montas Auto Academy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<script>
  if (!localStorage.getItem('sesionActiva')) {
    window.location.href = 'login.html';
  }
</script>

<nav class="navbar navbar-dark bg-dark px-4 py-3">
  <div class="d-flex align-items-center">
    <img data-branding="logo" src="assets/logo.png" alt="Logo Montas Auto Academy" width="50" class="me-2" />
    <div class="text-white">
      <h1 class="h5 mb-0">Sucursales</h1>
      <small>Sedes de la academia</small>
    </div>
  </div>
  <div class="ms-auto">
    <a href="panel.html" class="btn btn-outline-light btn-sm me-2">Inicio</a>
    <button onclick="logout()" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
  </div>
</nav>

<main class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h5 mb-0">Sedes registradas</h2>
    <button class="btn btn-primary" onclick="abrirFormularioSucursal()">+ Nueva sede</button>
  </div>

  <div class="table-responsive">
    <table class="table table-hover align-middle text-center">
      <thead class="table-dark">
        <tr>
          <th>Nombre</th>
          <th>Dirección</th>
          <th>Teléfono</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaSucursales">
        <tr><td colspan="5">Cargando...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div class="modal fade" id="modalSucursal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" id="formSucursal">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title" id="modalSucursalLabel">Nueva sede</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Nombre *</label>
          <input id="sucNombre" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Dirección</label>
          <input id="sucDireccion" class="form-control" />
        </div>
        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input id="sucTelefono" class="form-control" />
        </div>
        <div class="form-check form-switch" id="wrapperActivo" style="display:none">
          <input class="form-check-input" type="checkbox" id="sucActivo" checked />
          <label class="form-check-label" for="sucActivo">Sede activa</label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="submit" class="btn btn-primary">Guardar sede</button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </form>
  </div>
</div>

<div class="position-fixed bottom-0 end-0 p-3" style="z-index:1055"><div id="toasts"></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/authHelpers.js"></script>
<script>aplicarBranding();</script>
<script>
  let sucursalEditId = null;
  const modalSucursal = new bootstrap.Modal(document.getElementById('modalSucursal'));

  function showToast(message, type = 'info') {
    const container = document.getElementById('toasts');
    const toast = document.createElement('div');
    toast.className = `toast align-items-center text-bg-${type} border-0 mb-2`;
    toast.innerHTML = `<div class="d-flex"><div class="toast-body">${escapeHtml(message)}</div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>`;
    container.appendChild(toast);
    new bootstrap.Toast(toast, { delay: 4000 }).show();
  }

  async function cargarSucursales() {
    const tabla = document.getElementById('tablaSucursales');
    tabla.innerHTML = '<tr><td colspan="5">Cargando...</td></tr>';
    try {
      const res = await fetch(API_BASE + '/api/sucursales', { headers: getAuthHeaders() });
      const sedes = await res.json();
      if (!Array.isArray(sedes) || sedes.length === 0) {
        tabla.innerHTML = '<tr><td colspan="5">No hay sedes registradas.</td></tr>';
        return;
      }
      tabla.innerHTML = sedes.map(s => `
        <tr>
          <td><strong>${escapeHtml(s.nombre)}</strong></td>
          <td>${escapeHtml(s.direccion) || '—'}</td>
          <td>${escapeHtml(s.telefono) || '—'}</td>
          <td><span class="badge ${s.activo ? 'bg-success' : 'bg-secondary'}">${s.activo ? 'Activa' : 'Inactiva'}</span></td>
          <td><button class="btn btn-sm btn-warning" onclick="editarSucursal(${s.id})">Editar</button></td>
        </tr>
      `).join('');
    } catch (error) {
      console.error(error);
      tabla.innerHTML = '<tr><td colspan="5">Error al cargar las sedes.</td></tr>';
    }
  }

  function abrirFormularioSucursal() {
    sucursalEditId = null;
    document.getElementById('modalSucursalLabel').textContent = 'Nueva sede';
    document.getElementById('formSucursal').reset();
    document.getElementById('wrapperActivo').style.display = 'none';
    modalSucursal.show();
  }

  async function editarSucursal(id) {
    try {
      const res = await fetch(API_BASE + '/api/sucursales', { headers: getAuthHeaders() });
      const sedes = await res.json();
      const s = sedes.find(x => x.id === id);
      if (!s) throw new Error('Sede no encontrada');
      sucursalEditId = id;
      document.getElementById('modalSucursalLabel').textContent = `Editar sede — ${s.nombre}`;
      document.getElementById('sucNombre').value = s.nombre || '';
      document.getElementById('sucDireccion').value = s.direccion || '';
      document.getElementById('sucTelefono').value = s.telefono || '';
      document.getElementById('sucActivo').checked = !!s.activo;
      document.getElementById('wrapperActivo').style.display = '';
      modalSucursal.show();
    } catch (error) {
      showToast('No se pudo cargar la sede para editar.', 'danger');
    }
  }

  document.getElementById('formSucursal').addEventListener('submit', async function (e) {
    e.preventDefault();
    const payload = {
      nombre: document.getElementById('sucNombre').value.trim(),
      direccion: document.getElementById('sucDireccion').value.trim(),
      telefono: document.getElementById('sucTelefono').value.trim(),
      activo: document.getElementById('sucActivo').checked
    };
    try {
      const url = sucursalEditId ? `${API_BASE}/api/sucursales/${sucursalEditId}` : API_BASE + '/api/sucursales';
      const method = sucursalEditId ? 'PUT' : 'POST';
      const res = await fetch(url, { method, headers: getAuthHeaders(), body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error guardando la sede');
      modalSucursal.hide();
      showToast('Sede guardada correctamente', 'success');
      cargarSucursales();
    } catch (error) {
      showToast(error.message, 'danger');
    }
  });

  window.onload = function () {
    if (typeof requireAdminPage === 'function') requireAdminPage();
    cargarSucursales();
  };
</script>
</body>
</html>
