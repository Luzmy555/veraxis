<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Horario | Montas Auto Academy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <style>
    body {
      background-color: #f8f9fa;
    }
    @keyframes fadeInSlide {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; transform: translateX(50px); }
    }
    .horario-item {
      animation: fadeInSlide 0.5s ease;
      transition: background-color 0.3s;
    }
    .horario-item:hover {
      background-color: #e0f7fa;
      cursor: pointer;
    }
    .desaparecer {
      animation: fadeOut 0.5s forwards;
    }
  </style>
</head>

<body>
  <header class="bg-dark text-white py-3 px-4 d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center">
      <img src="assets/logo.PNG" alt="Logo" width="50" class="me-3" style="filter: drop-shadow(0 0 6px #ffffffaa);">
      <div>
        <h1 class="h5 mb-0">Montas Auto Academy</h1>
        <small>Mi Horario</small>
      </div>
    </div>
    <div>
      <a href="panel.html" class="btn btn-outline-light btn-sm">Volver al Panel</a>
    </div>
  </header>

  <main class="container my-5">
    <h2 class="text-center mb-4">Agendar Clases</h2>

    <form id="formHorario" class="row g-3 mb-4">
      <div class="col-md-3">
        <label class="form-label">Cliente</label>
        <select id="cliente" class="form-select" required>
          <option value="">Seleccione un cliente</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Día</label>
        <select id="dia" class="form-select" required>
          <option value="">Seleccione un día</option>
          <option>Lunes</option>
          <option>Martes</option>
          <option>Miércoles</option>
          <option>Jueves</option>
          <option>Viernes</option>
          <option>Sábado</option>
          <option>Domingo</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label">Hora</label>
        <input type="time" id="hora" class="form-control" required>
      </div>
      <div class="col-md-2">
        <label class="form-label">Repetir</label>
        <select id="repetir" class="form-select" required>
          <option value="true">Sí</option>
          <option value="false">No</option>
        </select>
      </div>
      <div class="col-md-2">
        <label class="form-label"># Clase</label>
        <input type="number" id="numeroClase" class="form-control" readonly>
      </div>
      <div class="col-md-12 text-end">
        <button type="submit" class="btn btn-success mt-3">Agregar Clase</button>
      </div>
    </form>

    <h4 class="mb-3">Mi Horario Actual</h4>
    <div class="table-responsive">
      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>Cliente</th>
            <th>Día</th>
            <th>Hora</th>
            <th># Clase</th>
            <th>Repetir</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tablaHorarios"></tbody>
      </table>
    </div>
  </main>

<script>
function formatoHora(hora) {
  const [h, m] = hora.split(":");
  let horaNum = parseInt(h);
  const minutos = m;
  const ampm = horaNum >= 12 ? "p.m." : "a.m.";
  horaNum = horaNum % 12;
  horaNum = horaNum ? horaNum : 12;
  return `${horaNum}:${minutos} ${ampm}`;
}

async function cargarClientes() {
  const select = document.getElementById("cliente");
  try {
    const res = await fetch("http://localhost:4000/api/clientes");
    const clientes = await res.json();
    clientes.forEach(c => {
      const option = document.createElement("option");
      option.value = c.id;
      option.textContent = c.nombre;
      select.appendChild(option);
    });
  } catch (error) {
    console.error("Error cargando clientes", error);
  }
}

async function cargarHorarios() {
  const tbody = document.getElementById("tablaHorarios");
  tbody.innerHTML = "";
  try {
    const res = await fetch("http://localhost:4000/api/horarios");
    const horarios = await res.json();

    horarios.forEach(h => {
      const fila = document.createElement("tr");
      fila.classList.add("horario-item");
      fila.innerHTML = `
        <td>${h.nombre_cliente}</td>
        <td>${h.dia}</td>
        <td>${formatoHora(h.hora)}</td>
        <td>${h.numero_clase}</td>
        <td>${h.repetir ? "Sí" : "No"}</td>
        <td><button class="btn btn-danger btn-sm" onclick="eliminarHorario(${h.id})">Eliminar</button></td>
      `;
      tbody.appendChild(fila);
    });
  } catch (error) {
    console.error("Error al cargar horarios", error);
  }
}

async function eliminarHorario(id) {
  if (confirm("¿Seguro que deseas eliminar esta clase?")) {
    await fetch(`http://localhost:4000/api/horarios/${id}`, { method: "DELETE" });
    cargarHorarios();
  }
}

async function obtenerNumeroClase(cliente_id) {
  const res = await fetch(`http://localhost:4000/api/asistencias/${cliente_id}`);
  const asistencias = await res.json();
  return asistencias.length + 1;
}

// Evento cuando cambia cliente
cliente.addEventListener("change", async function() {
  const cliente_id = this.value;
  if (cliente_id) {
    const numero = await obtenerNumeroClase(cliente_id);
    document.getElementById("numeroClase").value = numero;
  } else {
    document.getElementById("numeroClase").value = "";
  }
});

// Enviar formulario
formHorario.addEventListener("submit", async function(e) {
  e.preventDefault();

  const cliente_id = cliente.value;
  const dia = document.getElementById("dia").value;
  const hora = document.getElementById("hora").value;
  const repetir = document.getElementById("repetir").value === "true";
  const numero_clase = parseInt(document.getElementById("numeroClase").value);
  const nombre_cliente = cliente.options[cliente.selectedIndex].text;

  try {
    const res = await fetch("http://localhost:4000/api/horarios", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cliente_id, nombre_cliente, dia, hora, repetir, numero_clase })
    });

    if (res.ok) {
      alert("Clase agendada con éxito");
      formHorario.reset();
      cargarHorarios();
    } else {
      const error = await res.json();
      alert("Error al guardar: " + error.error);
    }
  } catch (error) {
    alert("Error de conexión");
    console.error(error);
  }
});

cargarClientes();
cargarHorarios();
</script>
</body>
</html>
