<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión | Montas Auto Academy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: #fff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
      text-align: center;
      width: 100%;
      max-width: 400px;
    }

    .login-box img {
      width: 60px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <img src="assets/logo.png" alt="Montas Auto Academy" />
    <h2 class="h5 mb-3">Montas Auto Academy</h2>
    <p class="text-muted mb-4">Solo personal autorizado</p>

    <form id="formLogin">
      <div class="mb-3 text-start">
        <label for="usuario" class="form-label">Usuario</label>
        <input type="text" class="form-control" id="usuario" required />
      </div>
      <div class="mb-3 text-start">
        <label for="clave" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="clave" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>
  </div>

  <script>
    document.getElementById("formLogin").addEventListener("submit", async function (e) {
      e.preventDefault();
  
      const usuario = document.getElementById("usuario").value;
      const clave = document.getElementById("clave").value;
  
      try {
        const res = await fetch("http://localhost:4000/api/auth/login", 
 {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, clave })
        });
  
        const result = await res.json();
  
        if (res.ok) {
          localStorage.setItem("sesionActiva", "true");
          localStorage.setItem("userRole", (result.rol || "usuario").toString().toLowerCase());
          localStorage.setItem("currentUser", result.usuario || "");
          localStorage.setItem("currentUserId", result.id || "");
          window.location.href = "panel.html";
        } else {
          alert(result.error);
        }
      } catch (error) {
        console.error("Error en conexión:", error);
        alert("Error en la conexión con el servidor");
      }
    });
  </script>
  

</body>
</html>
