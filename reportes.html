<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportes de Ventas | Montas Auto Academy</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    if (!localStorage.getItem('sesionActiva')) {
      window.location.href = 'login.html';
    }
  </script>
  
  <style>
    body {
      background-color: #f8f9fa;
    }
    @media print {
      .no-print {
        display: none !important;
      }
    }
    @media print {
  #graficoVentas {
    display: none !important;
  }
}

#printResumen {
  font-size: 0.95rem;
  color: #444;
}

@media print {
  #rangoFechas {
    margin-bottom: 1rem;
    display: block !important;
  }
}



  </style>
 
</head>
<body>

<header class="bg-dark text-white py-3 px-4">
  <div class="container d-flex align-items-center justify-content-between">
    <div class="d-flex align-items-center">
      <img src="assets/logo.png" alt="Logo" width="50" class="me-3" style="filter: drop-shadow(0 0 5px #fff);" />
      <div>
        <h1 class="h5 mb-0">Montas Auto Academy</h1>
        <small>Reporte de Ventas</small>
      </div>
    </div>
    <div class="ms-auto no-print">
      <a href="panel.html" class="btn btn-outline-light btn-sm me-2">Inicio</a>
      <a href="login.html" class="btn btn-outline-danger btn-sm">Cerrar sesión</a>
    </div>
  </div>
</header>

<main class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="h5">Pagos Registrados</h2>
    <button onclick="window.print()" class="btn btn-primary no-print">Imprimir Reporte</button>
  </div>
<!-- Rango de fechas visible solo en impresión -->
<div id="rangoFechas" class="my-3" style="display: none;">
  <div class="border-start border-4 border-primary ps-3">
    <strong>Rango seleccionado:</strong>
    <span id="textoRango"></span>
  </div>
</div>

  <!-- Filtros -->
  <div class="row g-3 align-items-end mb-4 no-print">
    <div class="col-md-3">
      <label class="form-label">Cliente</label>
      <select id="filtroCliente" class="form-select">
        <option value="">Todos</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Desde</label>
      <input type="date" id="filtroDesde" class="form-control" />
    </div>
    <div class="col-md-3">
      <label class="form-label">Hasta</label>
      <input type="date" id="filtroHasta" class="form-control" />
    </div>
    <div class="col-md-3">
      <label class="form-label">Concepto</label>
      <select id="filtroConcepto" class="form-select">
        <option value="">Todos</option>
        <option value="Inscripción">Inscripción</option>
        <option value="Pago semanal">Pago semanal</option>
        <option value="Abono">Abono</option>
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Estado del pago</label>
      <select id="filtroEstado" class="form-select">
        <option value="">Todos</option>
        <option value="pagado">Pagado</option>
        <option value="pendiente">Pendiente</option>
      </select>
    </div>
    
  </div>

  <!-- Tabla -->
  <div class="table-responsive">
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Fecha</th>
          <th>Cliente</th>
          <th>Concepto</th>
          <th>Monto</th>
        </tr>
      </thead>
      <tbody id="tablaPagos">
        <!-- Pagos cargados dinámicamente -->
      </tbody>
      <tfoot>
        <tr class="table-light">
          <td colspan="3" class="text-end"><strong>Total:</strong></td>
          <td id="totalIngresos" class="fw-bold text-success">RD$ 0</td>
        </tr>
      </tfoot>
    </table>
  </div>

 
<!-- Gráfico -->
<div id="graficoVentas" class="mt-5">
  <h5 class="mb-3">Gráfico de Ventas Mensuales</h5>
  <canvas id="canvasGrafico" height="100"></canvas>
</div>


<script>
  let pagos = [];
  let clientes = [];
  let chart;
  const ctx = document.getElementById("canvasGrafico").getContext("2d");

  async function cargarPagosYClientes() {
    try {
      const [resPagos, resClientes] = await Promise.all([
        fetch("http://localhost:4000/api/pagos"),
        fetch("http://localhost:4000/api/clientes")
      

      ]);

      pagos = await resPagos.json();
      clientes = await resClientes.json();

      cargarClientesEnFiltro();
      aplicarFiltros();
      actualizarGraficoMensual();

    } catch (error) {
      console.error("Error al cargar datos:", error);
    }
  }

  function cargarClientesEnFiltro() {
    const select = document.getElementById("filtroCliente");
    clientes.forEach(c => {
      const option = document.createElement("option");
      option.value = c.id;
      option.textContent = c.nombre;
      select.appendChild(option);
    });
  }

  function aplicarFiltros() {
  const clienteId = document.getElementById("filtroCliente").value;
  const desde = document.getElementById("filtroDesde").value;
  const hasta = document.getElementById("filtroHasta").value;
  const concepto = document.getElementById("filtroConcepto").value;
  const estado = document.getElementById("filtroEstado").value;

  const tbody = document.getElementById("tablaPagos");
  tbody.innerHTML = "";
  let total = 0;

  // Mostrar el rango de fechas si se seleccionó algo
  const rangoFechas = document.getElementById("rangoFechas");
  const textoRango = document.getElementById("textoRango");
  if (desde || hasta) {
    rangoFechas.style.display = "block";
    const desdeText = desde ? new Date(desde).toLocaleDateString("es-DO") : "Inicio";
    const hastaText = hasta ? new Date(hasta).toLocaleDateString("es-DO") : "Hoy";
    textoRango.textContent = `${desdeText} - ${hastaText}`;
  } else {
    rangoFechas.style.display = "none";
    textoRango.textContent = "";
  }

  pagos.forEach(pago => {
    const cliente = clientes.find(c => c.id === pago.cliente_id);
    if (!cliente) return;

    const fechaPago = new Date(pago.fecha).toISOString().split("T")[0];

    if (clienteId && pago.cliente_id != clienteId) return;
    if (desde && fechaPago < desde) return;
    if (hasta && fechaPago > hasta) return;
    if (concepto && pago.concepto !== concepto) return;
    if (estado && pago.estado !== estado) return;

    const monto = parseFloat(pago.monto) || 0;
    total += monto;
    const montoFormateado = monto.toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    const fila = document.createElement("tr");
    fila.innerHTML = `
      <td>${new Date(pago.fecha).toLocaleDateString("es-DO")}</td>
      <td>${cliente.nombre}</td>
      <td>${pago.concepto}</td>
      <td>RD$ ${montoFormateado}</td>
    `;
    tbody.appendChild(fila);
  });

  const totalFormateado = total.toLocaleString('es-DO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  document.getElementById("totalIngresos").textContent = `RD$ ${totalFormateado}`;
}

function actualizarGraficoMensual() {
  const meses = {};
  pagos.forEach(pago => {
    const fecha = new Date(pago.fecha);
    const mes = `${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, "0")}`;
    const monto = parseFloat(pago.monto) || 0;
    if (!meses[mes]) meses[mes] = 0;
    meses[mes] += monto;
  });

  const labels = Object.keys(meses).sort();
  const data = labels.map(m => meses[m]);

  const ctx = document.getElementById("canvasGrafico").getContext("2d"); // ✅ CORREGIDO AQUÍ
  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: labels.map(m => new Date(m + "-01").toLocaleString("es-DO", { month: "long", year: "numeric" })),
      datasets: [{
        label: "Ingresos por mes (RD$)",
        data,
        backgroundColor: "#0d6efd"
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => `RD$ ${ctx.raw}`
          }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: {
            callback: value => `RD$ ${value}`
          }
        }
      }
    }
  });
}

  document.getElementById("filtroCliente").addEventListener("change", aplicarFiltros);
  document.getElementById("filtroDesde").addEventListener("change", aplicarFiltros);
  document.getElementById("filtroHasta").addEventListener("change", aplicarFiltros);
  document.getElementById("filtroConcepto").addEventListener("change", aplicarFiltros);
  document.getElementById("filtroEstado").addEventListener("change", aplicarFiltros);

  window.onload = cargarPagosYClientes;
</script>

</body>
</html>
