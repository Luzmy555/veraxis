<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pagos | Montas Auto Academy</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <script src="js/config.js"></script>
<script src="js/authHelpers.js"></script>
<script>aplicarBranding();</script>

  <script>
    if (!localStorage.getItem("sesionActiva")) {
      window.location.href = "login.html";
    }
  </script>

  <style>
    body {
      background-color: #f8f9fa;
    }

    @media print {
      .no-print {
        display: none !important;
      }
    }

    img[alt="Logo Montas Auto Academy"] {
      filter: drop-shadow(0 0 5px #ffffffcc);
    }
  </style>
</head>
<body>
  <header class="bg-dark text-white py-3 px-4">
    <div class="container d-flex align-items-center justify-content-between">
      <div class="d-flex align-items-center">
        <img data-branding="logo" src="assets/logo.png" alt="Logo Montas Auto Academy" width="50" class="me-3" />
        <div>
          <h1 class="h5 mb-0" data-branding="nombre">Montas Auto Academy</h1>
          <small>Gestión de Pagos</small>
        </div>
      </div>

      <div class="ms-auto no-print">
        <a href="panel.html" class="btn btn-outline-light btn-sm me-2">Inicio</a>
        <button type="button" class="btn btn-outline-info btn-sm me-2" onclick="printHistorial()">Imprimir</button>
        <button type="button" onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="container my-5">
    <div class="mb-4">
      <h2 class="h5" id="nombreCliente">Pagos del Cliente</h2>
    </div>

    <div class="table-responsive mb-4">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>Fecha</th>
            <th>Concepto</th>
            <th>Monto</th>
            <th>Estado</th>
            <th class="no-print">Acción</th>
          </tr>
        </thead>
        <tbody id="tablaPagos"></tbody>
        <tfoot>
          <tr class="table-light">
            <td colspan="3" class="text-end fw-bold">Total pagado:</td>
            <td colspan="2" id="totalPagado" class="fw-bold text-success">RD$ 0.00</td>
          </tr>
        </tfoot>
      </table>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-header bg-dark text-white">Agregar nuevo pago</div>
      <div class="card-body">
        <form id="formPago">
          <div class="row g-3">
            <div class="col-md-3">
              <label for="fechaPago" class="form-label">Fecha</label>
              <input type="date" class="form-control" id="fechaPago" required />
            </div>

            <div class="col-md-3">
              <label for="conceptoPago" class="form-label">Concepto</label>
              <input
                type="text"
                class="form-control"
                id="conceptoPago"
                placeholder="Ej. Cuota 2, Pago final..."
                required
              />
            </div>

            <div class="col-md-2">
              <label for="montoPago" class="form-label">Monto</label>
              <input
                type="number"
                class="form-control"
                id="montoPago"
                min="0.01"
                step="0.01"
                required
              />
            </div>

            <div class="col-md-2">
              <label for="estadoPago" class="form-label">Estado</label>
              <select class="form-select" id="estadoPago" required>
                <option value="pagado" selected>Pagado</option>
                <option value="pendiente">Pendiente</option>
              </select>
            </div>

            <div class="col-md-2">
              <label for="metodoPago" class="form-label">Método</label>
              <select class="form-select" id="metodoPago">
                <option value="Efectivo" selected>Efectivo</option>
                <option value="Transferencia">Transferencia</option>
                <option value="Tarjeta">Tarjeta</option>
                <option value="Cheque">Cheque</option>
              </select>
            </div>
          </div>

          <div class="text-end mt-4">
            <button type="submit" class="btn btn-success">Registrar Pago</button>
            <a href="#" id="btnFactura" class="btn btn-outline-primary">Generar Factura</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    const API_URL = API_BASE + "/api";
    const params = new URLSearchParams(window.location.search);
    const idCliente = params.get("id");

    function getSafeHeaders(extra = {}) {
      try {
        return { ...getAuthHeaders(), ...extra };
      } catch (error) {
        console.error("Error obteniendo headers de autenticación:", error);
        return { ...extra };
      }
    }

    function cerrarSesion() {
      localStorage.removeItem("sesionActiva");
      window.location.href = "login.html";
    }

    function escapeHTML(texto) {
      return String(texto ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatearFecha(fecha) {
      if (!fecha) return "-";
      const f = new Date(fecha);
      if (isNaN(f.getTime())) return fecha;
      return f.toLocaleDateString("es-DO");
    }

    function formatearMoneda(valor) {
      const numero = Number(valor) || 0;
      return `RD$ ${numero.toFixed(2)}`;
    }

    function printHistorial() {
      const tabla = document.querySelector(".table-responsive");
      const clienteName = document.getElementById("nombreCliente").textContent;

      if (!tabla) {
        alert("No hay historial para imprimir.");
        return;
      }

      const contenido =
        '<!doctype html>' +
        '<html>' +
        '<head>' +
        '<title>Pagos - ' + clienteName + '</title>' +
        '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />' +
        '<style>body { padding: 20px; } h2 { text-align: center; margin-bottom: 30px; } .no-print { display: none !important; }</style>' +
        '</head>' +
        '<body>' +
        '<h2>' + clienteName + '</h2>' +
        tabla.outerHTML +
        '<' + '/body></html>';

      const iframe = document.createElement('iframe');
      iframe.style.position = 'fixed';
      iframe.style.right = '0';
      iframe.style.bottom = '0';
      iframe.style.width = '0';
      iframe.style.height = '0';
      iframe.style.border = '0';
      iframe.style.visibility = 'hidden';
      document.body.appendChild(iframe);
      iframe.srcdoc = contenido;
      iframe.onload = function () {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
        setTimeout(() => document.body.removeChild(iframe), 1000);
      };
    }

    async function cargarPagos() {
      if (!idCliente) return;

      try {
        const [resPagos, resCliente] = await Promise.all([
          fetch(`${API_URL}/pagos/cliente/${idCliente}`, {
            headers: getSafeHeaders()
          }),
          fetch(`${API_URL}/clientes/${idCliente}`, {
            headers: getSafeHeaders()
          })
        ]);

        if (!resPagos.ok || !resCliente.ok) {
          console.error("Error al cargar pagos o cliente:", {
            pagosStatus: resPagos.status,
            clienteStatus: resCliente.status
          });
          alert("No se pudieron cargar los pagos o los datos del cliente.");
          return;
        }

        const pagosData = await resPagos.json();
        const cliente = await resCliente.json();

        const pagos = Array.isArray(pagosData)
          ? pagosData
          : Array.isArray(pagosData?.pagos)
            ? pagosData.pagos
            : [];

        document.getElementById("nombreCliente").textContent =
          `Pagos de ${cliente?.nombre || "Cliente"}`;

        const clienteIdFactura = cliente?.id || cliente?._id || idCliente;
        document.getElementById("btnFactura").href = `factura.html?id=${clienteIdFactura}`;

        const tbody = document.getElementById("tablaPagos");
        tbody.innerHTML = "";

        if (pagos.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="5" class="text-center text-muted py-4">
                Este cliente todavía no tiene pagos registrados.
              </td>
            </tr>
          `;
          document.getElementById("totalPagado").textContent = formatearMoneda(0);
          return;
        }

        let totalPagado = 0;

        pagos.forEach((p) => {
          const monto = Number(p.monto) || 0;
          const estado = String(p.estado || "").toLowerCase().trim();

          if (estado === "pagado") {
            totalPagado += monto;
          }

          const fila = document.createElement("tr");
          fila.innerHTML = `
            <td>${formatearFecha(p.fecha)}</td>
            <td>${escapeHTML(p.concepto)}</td>
            <td>${formatearMoneda(monto)}</td>
            <td>
              <span class="badge ${estado === "pagado" ? "bg-success" : "bg-warning text-dark"}">
                ${escapeHTML(p.estado || "Sin estado")}
              </span>
            </td>
            <td class="no-print">
              <button class="btn btn-sm btn-danger" onclick="eliminarPago(${p.id || p._id})">
                Eliminar
              </button>
            </td>
          `;
          tbody.appendChild(fila);
        });

        document.getElementById("totalPagado").textContent = formatearMoneda(totalPagado);
      } catch (error) {
        console.error("Error al cargar pagos:", error);
        alert("Error de conexión al cargar los pagos.");
      }
    }

    async function eliminarPago(id) {
      if (!id) {
        alert("No se pudo identificar el pago a eliminar.");
        return;
      }

      if (!confirm("¿Seguro que deseas eliminar este pago?")) return;

      try {
        const res = await fetch(`${API_URL}/pagos/${id}`, {
          method: "DELETE",
          headers: getSafeHeaders()
        });

        if (res.ok) {
          alert("Pago eliminado correctamente.");
          await cargarPagos();
        } else {
          const errorBody = await res.text();
          console.error("Error eliminando pago:", res.status, errorBody);
          alert("No se pudo eliminar el pago.");
        }
      } catch (error) {
        console.error("Error de conexión al eliminar pago:", error);
        alert("Error de conexión con el servidor al eliminar el pago.");
      }
    }

    document.getElementById("formPago").addEventListener("submit", async function (e) {
      e.preventDefault();

      if (!idCliente) {
        alert("No se ha seleccionado un cliente.");
        return;
      }

      const fecha = document.getElementById("fechaPago").value.trim();
      const concepto = document.getElementById("conceptoPago").value.trim();
      const monto = parseFloat(document.getElementById("montoPago").value);
      const estado = document.getElementById("estadoPago").value;
      const metodo_pago = document.getElementById("metodoPago").value;

      if (!fecha || !concepto || !estado) {
        alert("Completa todos los campos.");
        return;
      }

      if (isNaN(monto) || monto <= 0) {
        alert("El monto debe ser mayor que 0.");
        return;
      }

      const data = {
        cliente_id: idCliente,
        fecha,
        concepto,
        monto,
        estado,
        metodo_pago
      };

      try {
        const res = await fetch(`${API_URL}/pagos`, {
          method: "POST",
          headers: getSafeHeaders({
            "Content-Type": "application/json"
          }),
          body: JSON.stringify(data)
        });

        let result = {};
        try {
          result = await res.json();
        } catch {
          result = {};
        }

        if (res.ok) {
          alert("Pago guardado con éxito.");
          this.reset();
          document.getElementById("estadoPago").value = "pagado";
          await cargarPagos();
        } else {
          alert("Error al guardar: " + (result.error || "No se pudo registrar el pago."));
        }
      } catch (error) {
        console.error("Error al guardar pago:", error);
        alert("Error de conexión con el servidor.");
      }
    });

    if (!idCliente) {
      alert("No se ha seleccionado un cliente.");
      window.location.href = "panel.html";
    } else {
      cargarPagos();
    }
  </script>
</body>
</html>
